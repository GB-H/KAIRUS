<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRUS</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app" id="app">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="KAIRUS" class="logo-img">
                <span class="logo-text">KAIRUS</span>
                <button class="sidebar-toggle" id="sidebarToggle" title="Recolher menu">
                    <svg class="icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <path d="M9 3v18"></path>
                        <path d="m14 9-3 3 3 3"></path>
                    </svg>
                    <svg class="icon-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <path d="M9 3v18"></path>
                        <path d="m12 9 3 3-3 3"></path>
                    </svg>
                </button>
            </div>

            <button class="new-chat" id="newChat" title="Nova conversa">
                <span class="plus">+</span>
                <span class="btn-label">Nova conversa</span>
            </button>

            <div class="conversations-label">Conversas</div>

            <div id="conversationList"></div>

            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn" title="Sair">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span class="btn-label">Sair</span>
                </button>
                <div class="version">KAIRUS v0.4.0</div>
            </div>
        </aside>

        <main class="main">
            <header class="header">
                <button class="menu-toggle" id="menuToggle" title="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="header-title">KAIRUS</span>
                <div class="status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Sistema online</span>
                </div>
            </header>

            <section id="messages">
                <div class="welcome" id="welcomeScreen">
                    <img src="logo.png" alt="KAIRUS" class="welcome-logo-img">
                    <h1>Como posso ajudar?</h1>
                    <p>Converse com o KAIRUS.</p>
                    <div class="suggestions" id="suggestions">
                        <button class="suggestion" data-message="Quem e voce?">Quem e voce?</button>
                        <button class="suggestion" data-message="O que voce sabe fazer?">O que voce sabe fazer?</button>
                        <button class="suggestion" data-message="Conta uma piada">Conta uma piada</button>
                        <button class="suggestion" data-message="Me explique buracos negros">Me explique buracos negros</button>
                    </div>
                </div>
            </section>

            <div class="input-area">
                <form id="chatForm" class="chat-form">
                    <textarea
                        id="messageInput"
                        placeholder="Envie uma mensagem para o KAIRUS..."
                        rows="1"
                    ></textarea>
                    <button
                        type="submit"
                        id="sendButton"
                        class="send-btn"
                        aria-label="Enviar mensagem"
                        disabled
                    >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </form>
                <div class="disclaimer">
                    KAIRUS pode cometer erros. Verifique informacoes importantes.
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
